<!DOCTYPE html>
<html lang="es-EC">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Estudio 360 CruzTRD — prototipo inmersivo</title>
<meta name="robots" content="noindex">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#19C37D;--accent2:#2DD4A7;--ink:#EDF3F1;--muted:#93a3a9;--mono:'Share Tech Mono',monospace;--disp:'Poppins',system-ui,sans-serif;--bg:#04070a}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;cursor:grab;touch-action:none}
#c.drag{cursor:grabbing}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 46%,rgba(3,6,9,.5) 88%,rgba(3,6,9,.9) 100%)}
.badge{position:fixed;top:20px;left:22px;z-index:6;font-family:'Poppins';font-weight:700;font-size:20px;color:var(--ink);text-shadow:0 2px 14px rgba(0,0,0,.8)}
.badge b{color:var(--accent)}
.topr{position:fixed;top:18px;right:22px;z-index:6;text-align:right;font-family:var(--mono);font-size:11px;letter-spacing:3px;color:#9fe9cf;text-transform:uppercase;opacity:.8;text-shadow:0 2px 14px rgba(0,0,0,.9)}

/* hotspots */
.hs{position:fixed;z-index:4;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;will-change:left,top;transition:opacity .25s}
.hs .dot{width:22px;height:22px;border-radius:50%;background:rgba(45,212,167,.18);border:1.5px solid var(--accent2);display:flex;align-items:center;justify-content:center;animation:pulse 2.4s ease-out infinite}
.hs .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent2);box-shadow:0 0 8px var(--accent2)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(45,212,167,.45)}70%{box-shadow:0 0 0 16px rgba(45,212,167,0)}100%{box-shadow:0 0 0 0 rgba(45,212,167,0)}}
.hs .lbl{position:absolute;left:30px;top:50%;transform:translateY(-50%);white-space:nowrap;font-family:'Poppins';font-weight:600;font-size:13px;color:#eafff6;background:rgba(5,14,12,.6);padding:5px 11px;border-radius:999px;border:1px solid rgba(45,212,167,.28);backdrop-filter:blur(6px);opacity:0;transition:opacity .2s;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.hs:hover .lbl{opacity:1}
.hs:hover .dot{background:rgba(45,212,167,.4)}
.hs.fire .dot{animation:fire .7s ease-out}
@keyframes fire{0%{box-shadow:0 0 0 0 rgba(45,212,167,.9)}100%{box-shadow:0 0 0 46px rgba(45,212,167,0)}}
/* puerta: saltar a otra sala */
.hs.door{z-index:5}
.hs.door .dgate{width:56px;height:56px;border-radius:50%;background:rgba(45,212,167,.14);border:2px solid var(--accent2);display:flex;align-items:center;justify-content:center;box-shadow:0 0 26px rgba(45,212,167,.42);animation:pulse 2.4s ease-out infinite;backdrop-filter:blur(3px)}
.hs.door .darrow{font-size:25px;color:var(--accent2);line-height:1;font-weight:700}
.hs.door .dlbl{position:absolute;left:50%;top:64px;transform:translateX(-50%);white-space:nowrap;font-family:'Poppins';font-weight:600;font-size:13px;color:#eafff6;background:rgba(5,14,12,.72);padding:6px 13px;border-radius:999px;border:1px solid rgba(45,212,167,.4);backdrop-filter:blur(6px);text-shadow:0 1px 6px #000}
.hs.door:hover .dgate{background:rgba(45,212,167,.32)}
.fadeov{position:fixed;inset:0;z-index:9;background:#04070a;opacity:0;pointer-events:none;transition:opacity .42s ease}
#roomtag{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:6;font-family:var(--mono);font-size:12px;letter-spacing:3px;color:#cfe9df;text-transform:uppercase;text-shadow:0 2px 12px #000;pointer-events:none}

/* ====== panel de despliegue ====== */
.panel{position:fixed;top:0;right:0;height:100%;width:min(480px,93vw);z-index:8;background:linear-gradient(180deg,rgba(6,11,14,.97),rgba(4,7,10,.99));border-left:1px solid rgba(45,212,167,.22);backdrop-filter:blur(14px);transform:translateX(102%);transition:transform .55s cubic-bezier(.22,1,.36,1);padding:40px 26px 26px;display:flex;flex-direction:column;box-shadow:-30px 0 70px rgba(0,0,0,.55);overflow-y:auto}
.panel.open{transform:translateX(0)}
.panel .x{position:absolute;top:13px;right:15px;width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(6,11,14,.6);color:var(--ink);font-size:17px;cursor:pointer;line-height:1;z-index:5}
.charwrap{position:relative;height:250px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:4px}
.charwrap::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:60%;height:24px;border-radius:50%;background:radial-gradient(ellipse,rgba(45,212,167,.5),transparent 70%);filter:blur(5px)}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes sprun{from{background-position-x:0%}to{background-position-x:100%}}
@keyframes spy2{from{background-position-y:0%}to{background-position-y:100%}}
@keyframes deploy{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.charspr{display:block;height:250px;width:auto;background-repeat:no-repeat;background-position:0% 0%;filter:drop-shadow(0 0 22px rgba(25,195,125,.34)) drop-shadow(0 20px 26px rgba(0,0,0,.6));animation:breathe 6.5s ease-in-out infinite;will-change:background-position}
.charspr.reveal{animation:breathe 6.5s ease-in-out infinite, deploy .6s cubic-bezier(.22,1,.36,1) both}
.charspr.hosta{aspect-ratio:1000/877;background-size:1200% 200%}
.charspr.infraa{aspect-ratio:540/650;background-size:2500% 100%;background-position:0% 50%}
.charspr.sega{aspect-ratio:1000/1102;background-size:1200% 200%}
.charspr.pagosa{aspect-ratio:1000/1062;background-size:1000% 200%}
.charspr.susca{aspect-ratio:1000/1331;background-size:1200% 200%}
.charspr.mkta{aspect-ratio:1000/1333;background-size:1200% 200%}
.charspr.fidela{aspect-ratio:1000/1061;background-size:1200% 200%}
.charspr.dasha{aspect-ratio:1000/1338;background-size:1200% 200%}
.charspr.go.hosta{animation:breathe 6.5s ease-in-out infinite, sprun 1s steps(12,jump-none) 2 both, spy2 2s steps(2,jump-none) 1 both}
.charspr.go.sega{animation:breathe 6.5s ease-in-out infinite, sprun 1s steps(12,jump-none) 2 both, spy2 2s steps(2,jump-none) 1 both}
.charspr.go.pagosa{animation:breathe 6.5s ease-in-out infinite, sprun 1s steps(10,jump-none) 2 both, spy2 2s steps(2,jump-none) 1 both}
.charspr.go.susca{animation:breathe 6.5s ease-in-out infinite, sprun 1s steps(12,jump-none) 2 both, spy2 2s steps(2,jump-none) 1 both}
.charspr.go.mkta{animation:breathe 6.5s ease-in-out infinite, sprun 1s steps(12,jump-none) 2 both, spy2 2s steps(2,jump-none) 1 both}
.charspr.go.fidela{animation:breathe 6.5s ease-in-out infinite, sprun 1s steps(12,jump-none) 2 both, spy2 2s steps(2,jump-none) 1 both}
.charspr.go.dasha{animation:breathe 6.5s ease-in-out infinite, sprun 1s steps(12,jump-none) 2 both, spy2 2s steps(2,jump-none) 1 both}
.charspr.go.infraa{animation:breathe 6.5s ease-in-out infinite, sprun 3s steps(25,jump-none) 1 both}

.pEye{font-family:var(--mono);letter-spacing:3px;text-transform:uppercase;color:var(--accent2);font-size:11px}
.panel h2{font-family:'Poppins';font-weight:700;font-size:28px;line-height:1.03;letter-spacing:-.5px;margin-top:3px}
.pWho{font-family:var(--mono);font-size:12px;color:#9fe9cf;letter-spacing:1px;margin-top:5px}
.pTxt{font-size:14.5px;line-height:1.5;color:#cfe0dc;margin-top:11px}

/* holo (video + cuadros) */
.holo{position:relative;width:100%;aspect-ratio:16/9;border-radius:13px;overflow:hidden;margin-top:16px;background:linear-gradient(180deg,rgba(10,17,20,.86),rgba(7,11,13,.9));box-shadow:0 0 0 1px rgba(45,212,167,.4),0 0 34px rgba(25,195,125,.2),0 20px 50px rgba(0,0,0,.5)}
.holo .cn{position:absolute;width:16px;height:16px;border:2px solid var(--accent2);z-index:6;opacity:.9}
.holo .cn.tl{top:8px;left:8px;border-right:0;border-bottom:0}.holo .cn.tr{top:8px;right:8px;border-left:0;border-bottom:0}.holo .cn.bl{bottom:8px;left:8px;border-right:0;border-top:0}.holo .cn.br{bottom:8px;right:8px;border-left:0;border-top:0}
@keyframes blink{50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes lwscroll{to{transform:translateX(-120px)}}
/* --- componentes de cuadro (de la pagina de capas) --- */
.vpanel{position:absolute;inset:0;z-index:3}
.vpanel .cvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0;transition:opacity .9s ease .35s;filter:saturate(1.3) brightness(1.1) contrast(1.04)}
.holo.in .vpanel .cvid{opacity:1}
.vtsh{position:absolute;left:0;right:0;top:0;height:38%;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(4,8,9,.72),transparent)}
.vbsh{position:absolute;left:0;right:0;bottom:0;height:52%;z-index:1;pointer-events:none;background:linear-gradient(0deg,rgba(4,8,9,.82),rgba(4,8,9,.25) 55%,transparent)}
.vhead{position:absolute;top:10px;left:13px;right:13px;z-index:4;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:9.5px;letter-spacing:1px;color:#eafff6;text-transform:uppercase;text-shadow:0 1px 6px #000}
.vhead .live{color:var(--accent2)}.vhead .live i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 7px var(--accent);margin-right:5px;vertical-align:middle;animation:blink 1.6s infinite}
.vchip{font-family:var(--mono);font-size:9.5px;color:#eafff6;background:rgba(6,12,12,.5);border:1px solid rgba(45,212,167,.4);border-radius:999px;padding:5px 9px;backdrop-filter:blur(4px);white-space:nowrap;opacity:0;transform:translateY(8px);transition:opacity .5s ease var(--d),transform .5s ease var(--d)}
.holo.in .vchip{opacity:1;transform:none}
.vchip b{color:var(--accent2)}
.vbadge{display:inline-block;text-align:right;opacity:0;transform:translateY(8px);transition:opacity .6s ease .7s,transform .6s ease .7s}
.holo.in .vbadge{opacity:1;transform:none}
.vbadge b{display:block;font-family:var(--disp);font-weight:700;font-size:22px;color:#eafff6;line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.85)}
.vbadge span{font-family:var(--mono);font-size:9px;color:#cdeee1;letter-spacing:.5px}
.vkpis{position:absolute;top:30px;left:13px;right:13px;z-index:4;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.vkpi{background:rgba(6,12,12,.46);border:1px solid rgba(45,212,167,.3);border-radius:9px;padding:6px 9px;backdrop-filter:blur(5px);opacity:0;transform:translateY(-8px);transition:opacity .5s ease var(--d),transform .5s ease var(--d)}
.holo.in .vkpi{opacity:1;transform:none}
.vkpi .l{font-size:8px;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;font-family:var(--mono)}
.vkpi .v{font-size:16px;font-weight:700;color:#eafff6;font-family:var(--disp);margin-top:2px;line-height:1;font-variant-numeric:tabular-nums}
.vkpi .d{font-size:8.5px;color:var(--accent2);font-family:var(--mono);margin-top:2px}
.ov{position:absolute;z-index:4}
.ov.tl{top:30px;left:13px}.ov.tr{top:30px;right:13px}.ov.bl{bottom:12px;left:13px}.ov.br{bottom:12px;right:13px}
.ov.bc{bottom:11px;left:50%;transform:translateX(-50%)}
.ov.lc{top:50%;left:13px;transform:translateY(-50%)}.ov.rc{top:50%;right:13px;transform:translateY(-50%)}
.ov.cluster{bottom:12px;left:13px;max-width:210px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:4}
.ov.cluster.cr{left:auto;right:13px;align-items:flex-end}
.ov.cluster .rail{width:100%;gap:5px}
.ov.cluster .gaugelive{align-items:flex-start;gap:5px}
.ov.cluster.cr .gaugelive{align-items:flex-end}
.ov.cluster .gaugelive .gauge,.ov.cluster .gaugelive .gauge svg{width:78px;height:78px}
.ov.cluster .gaugelive .gaugev b{font-size:13px}
.ov.cluster .latlive{width:132px}
.ov.cluster .bigmini svg{width:94px;height:94px}
.ov.cluster .rowp{flex-wrap:wrap;gap:5px;max-width:210px}
.rail{display:flex;flex-direction:column;gap:6px;width:134px}
.rowp{display:flex;gap:6px;flex-wrap:wrap}
.hugen{font-family:var(--disp);font-weight:700;font-size:32px;color:#eafff6;line-height:.95;text-shadow:0 2px 16px rgba(0,0,0,.85);opacity:0;transform:translateY(10px);transition:opacity .6s ease .5s,transform .6s ease .5s}
.holo.in .hugen{opacity:1;transform:none}
.hugen small{display:block;font-family:var(--mono);font-size:9px;color:var(--accent2);letter-spacing:1px;margin-top:4px;font-weight:400}
.stat{font-family:var(--disp);opacity:0;transition:opacity .6s ease var(--d,.6s)}
.holo.in .stat{opacity:1}
.stat b{display:block;font-weight:700;font-size:19px;color:#eafff6;line-height:1;text-shadow:0 2px 10px #000}
.stat span{font-family:var(--mono);font-size:8px;color:var(--accent2);text-transform:uppercase;letter-spacing:1px}
.bigmini svg{width:120px;height:120px;max-height:none}
.bigmini .donutv b,.bigmini .gaugev b,.bigmini .radarv b{font-size:20px}
.bigmini .donutv span,.bigmini .gaugev span,.bigmini .radarv span{font-size:8px}
.gauge{position:relative;display:flex;align-items:center;justify-content:center}
.gauge svg{width:100%;height:100%}
.gaugev{position:absolute;text-align:center}
.gaugev b{font-size:20px;font-weight:700;color:#eafff6;font-family:var(--disp);display:block;line-height:1}
.gaugev span{font-family:var(--mono);font-size:8px;color:var(--accent2);letter-spacing:1px;text-transform:uppercase}
.garc{fill:none;stroke:rgba(255,255,255,.08);stroke-width:9;stroke-linecap:round}
.gfill{fill:none;stroke:#2DD4A7;stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(45,212,167,.85));stroke-dasharray:var(--c);stroke-dashoffset:var(--c);transition:stroke-dashoffset 1.5s cubic-bezier(.2,.8,.2,1) .5s}
.holo.in .gfill{stroke-dashoffset:var(--o)}
.donut{position:relative;display:flex;align-items:center;justify-content:center}
.donut svg{width:100%;height:100%}
.dntrack{fill:none;stroke:rgba(255,255,255,.08);stroke-width:11}
.dnfill{fill:none;stroke:#2DD4A7;stroke-width:11;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(45,212,167,.8));stroke-dasharray:var(--c);stroke-dashoffset:var(--c);transition:stroke-dashoffset 1.5s ease .5s}
.holo.in .dnfill{stroke-dashoffset:var(--o)}
.donutv{position:absolute;text-align:center}.donutv b{font-size:20px;font-weight:700;color:#eafff6;font-family:var(--disp);display:block;line-height:1}.donutv span{font-family:var(--mono);font-size:8px;color:var(--accent2);text-transform:uppercase;letter-spacing:1px}
.radar{position:relative;display:flex;align-items:center;justify-content:center}
.radar svg{width:100%;height:100%}
.rgrid{fill:none;stroke:rgba(45,212,167,.22);stroke-width:1}
.sweep{transform-origin:center;animation:spin 3.6s linear infinite}
.rblip{fill:#5BF3C0;filter:drop-shadow(0 0 4px #2DD4A7)}
.radarv{position:absolute;text-align:center}.radarv b{font-size:18px;font-weight:700;color:#eafff6;font-family:var(--disp);display:block;line-height:1}.radarv span{font-family:var(--mono);font-size:8px;color:var(--accent2);text-transform:uppercase;letter-spacing:1px}
.rings{position:relative;display:flex;align-items:center;justify-content:center}
.rings svg{width:100%;height:100%}
.rtrack{fill:none;stroke:rgba(255,255,255,.07);stroke-width:7}
.rfill{fill:none;stroke-width:7;stroke-linecap:round;stroke-dasharray:var(--c);stroke-dashoffset:var(--c);transition:stroke-dashoffset 1.5s ease .5s;transform:rotate(-90deg);transform-origin:center}
.holo.in .rfill{stroke-dashoffset:var(--o)}
.txlist{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:9.5px;overflow:hidden}
.txrow{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:7px;opacity:0;transform:translateX(-10px);transition:opacity .4s var(--d),transform .4s var(--d)}
.holo.in .txrow{opacity:1;transform:none}
.txrow .ok{color:var(--accent2)}.txrow .am{color:#eafff6}
.vsplit{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column}
.vsplit .vtop{position:relative;flex:0 0 54%;overflow:hidden}
.vsplit .vtop .cvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .9s ease .35s;filter:saturate(1.3) brightness(1.1)}
.holo.in .vsplit .vtop .cvid{opacity:1}
.vsplit .vbot{flex:1;display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px;align-items:center;background:linear-gradient(180deg,rgba(6,11,12,.9),rgba(4,8,9,.95))}
.vsplit .vbot .bigmini{display:flex;align-items:center;justify-content:center}
.vsplit .vbot .bigmini svg{width:96px;height:96px}
.vsplit .vbot .bigmini .donutv b{font-size:18px}.vsplit .vbot .bigmini .donutv span{font-size:8px}
.vtag{position:absolute;top:10px;right:13px;z-index:5;font-family:var(--disp);font-weight:700;font-size:16px;color:#eafff6;line-height:1;text-align:right;text-shadow:0 2px 10px #000;opacity:0;transform:translateY(-6px);transition:opacity .5s ease .6s,transform .5s ease .6s}
.holo.in .vtag{opacity:1;transform:none}
.vtag small{display:block;font-family:var(--mono);font-weight:400;font-size:8px;color:#cdeee1;letter-spacing:.5px;margin-top:3px}
.wfunnel{display:flex;flex-direction:column;gap:5px;width:200px}
.wfunnel i{height:20px;margin:0 auto;border-radius:5px;background:linear-gradient(90deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:#04140d;font-weight:700;white-space:nowrap;padding:0 9px;opacity:0;transform:scaleX(.8);transition:opacity .45s var(--d),transform .45s var(--d)}
.holo.in .wfunnel i{opacity:1;transform:none}
.cohstrip{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;width:100%;height:34px}
.cohstrip i{border-radius:2px;background:rgba(45,212,167,var(--a));opacity:0;transition:opacity .4s var(--d)}
.holo.in .cohstrip i{opacity:1}
.sparkbox{width:100%}
.sparkbox .spk-cap{font-family:var(--mono);font-size:8.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.sparkbox .spk-row{display:flex;align-items:flex-end;justify-content:space-between;gap:9px}
.sparkbox svg{flex:1;min-width:0}
.sparkbox .spk-end{font-family:var(--disp);font-weight:700;font-size:17px;color:#eafff6;line-height:1;white-space:nowrap}
.sparkbox .spk-end small{display:block;font-family:var(--mono);font-weight:400;font-size:7.5px;color:var(--accent2);letter-spacing:.5px;margin-top:3px}
.gaugelive{display:flex;flex-direction:column;align-items:center;gap:7px}
.gaugelive .gauge{flex:none;width:100px;height:100px;position:relative}
.gaugelive .gauge svg{width:100px;height:100px}
.gaugelive .gaugev b{font-size:17px}.gaugelive .gaugev span{font-size:7px}
.gspin{transform-origin:60px 60px;animation:spin 3.2s linear infinite}
.gping{fill:#5BF3C0;filter:drop-shadow(0 0 6px rgba(91,243,192,.95))}
.latlive{width:132px;background:rgba(6,12,12,.5);border:1px solid rgba(45,212,167,.28);border-radius:10px;padding:7px 9px 6px;backdrop-filter:blur(5px)}
.latwrap{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.latwrap .ll{font-family:var(--mono);font-size:7.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.latwrap .lv{font-family:var(--disp);font-weight:700;font-size:14px;color:#eafff6;font-variant-numeric:tabular-nums;line-height:1}
.latwrap .lv u{font-size:8px;font-weight:400;color:var(--accent2);text-decoration:none;margin-left:2px}
.latwave{display:block;width:100%;height:24px;overflow:hidden}
.latwave polyline{fill:none;stroke:#2DD4A7;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 3px rgba(45,212,167,.6))}
.latwave .lwscroll{animation:lwscroll 1.9s linear infinite}
