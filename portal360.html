<!DOCTYPE html>
<html lang="es-EC">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Estudio 360 CruzTRD — prototipo inmersivo</title>
<meta name="robots" content="noindex">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&family=Share+Tech+Mono&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#19C37D;--accent2:#2DD4A7;--ink:#EDF3F1;--muted:#93a3a9;--mono:'Share Tech Mono',monospace;--disp:'Poppins',system-ui,sans-serif;--bg:#04070a}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;cursor:grab;touch-action:none}
#c.drag{cursor:grabbing}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 46%,rgba(3,6,9,.5) 88%,rgba(3,6,9,.9) 100%)}
.badge{position:fixed;top:20px;left:22px;z-index:6;font-family:'Poppins';font-weight:700;font-size:20px;color:var(--ink);text-shadow:0 2px 14px rgba(0,0,0,.8)}
.badge b{color:var(--accent)}
.topr{position:fixed;top:18px;right:22px;z-index:6;text-align:right;font-family:var(--mono);font-size:11px;letter-spacing:3px;color:#9fe9cf;text-transform:uppercase;opacity:.8;text-shadow:0 2px 14px rgba(0,0,0,.9)}

/* hotspots unificados (mismo lenguaje para anfitrión, puertas y directorio) */
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(45,212,167,.4)}70%{box-shadow:0 0 0 13px rgba(45,212,167,0)}100%{box-shadow:0 0 0 0 rgba(45,212,167,0)}}
.hs{position:fixed;z-index:4;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;will-change:left,top;transition:opacity .25s}
.hs .mk{position:relative;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(8,16,15,.3);border:1.5px solid rgba(45,212,167,.9);box-shadow:0 0 15px rgba(45,212,167,.3),inset 0 0 10px rgba(45,212,167,.12);backdrop-filter:blur(2px);animation:pulse 2.8s ease-out infinite;transition:transform .2s ease,background .2s ease,box-shadow .2s ease}
.hs:hover .mk{transform:scale(1.15);background:rgba(45,212,167,.26);box-shadow:0 0 26px rgba(45,212,167,.5)}
.hs .mk .ic{font-family:var(--mono);font-size:14px;color:#daffef;line-height:1}
.hs.char .mk .ic{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 9px var(--accent2)}
.hs .lbl{position:absolute;left:50%;top:44px;transform:translateX(-50%) translateY(5px);white-space:nowrap;font-family:'Poppins';font-weight:600;font-size:12.5px;color:#eafff6;background:rgba(6,12,12,.5);padding:7px 14px;border-radius:999px;border:1px solid rgba(45,212,167,.28);backdrop-filter:blur(10px);opacity:0;transition:opacity .22s ease,transform .22s ease;text-shadow:0 1px 6px #000;pointer-events:none}
.hs:hover .lbl{opacity:1;transform:translateX(-50%) translateY(0)}
.fadeov{position:fixed;inset:0;z-index:9;background:#04070a;opacity:0;pointer-events:none;transition:opacity .42s ease}
#roomtag{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:6;font-family:var(--mono);font-size:12px;letter-spacing:3px;color:#cfe9df;text-transform:uppercase;text-shadow:0 2px 12px #000;pointer-events:none}
/* ===== directorio: modal central + fondo difuminado (glassmorphism) ===== */
.dirback{position:fixed;inset:0;z-index:7;background:rgba(3,7,9,.52);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .4s ease}
.dirback.open{opacity:1;pointer-events:auto}
.dirmodal{position:fixed;top:50%;left:50%;transform:translate(-50%,-47%) scale(.97);z-index:8;width:min(540px,92vw);max-height:86vh;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .4s ease,transform .45s cubic-bezier(.22,1,.36,1);background:radial-gradient(130% 90% at 50% 0%,rgba(16,30,28,.95),rgba(6,11,13,.97));border:1px solid rgba(45,212,167,.26);border-radius:20px;padding:30px 28px 24px;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 60px rgba(25,195,125,.12),inset 0 1px 0 rgba(255,255,255,.05)}
.dirmodal::before{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(45,212,167,.03) 0 1px,transparent 1px 4px);opacity:.5;mix-blend-mode:screen}
.dirmodal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.dirmodal .x{position:absolute;top:15px;right:15px;width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(6,11,14,.5);color:var(--ink);font-size:16px;cursor:pointer;line-height:1;z-index:2}
.direye{font-family:var(--mono);letter-spacing:4px;text-transform:uppercase;color:var(--accent2);font-size:11px}
.dirh{font-family:'Poppins';font-weight:700;font-size:29px;line-height:1.03;margin-top:5px;letter-spacing:-.5px}
.dirh b{color:var(--accent)}
.dirsub{font-size:13.5px;color:#9fb3ad;margin-top:6px;margin-bottom:20px}
.dirlist{display:grid;gap:10px}
.dirow{position:relative;display:flex;align-items:center;gap:15px;width:100%;text-align:left;cursor:pointer;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:15px 16px 15px 19px;color:var(--ink);overflow:hidden;transition:background .2s,border-color .2s,transform .18s}
.dirow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent2);transform:scaleY(0);transition:transform .2s}
.dirow:hover{background:rgba(45,212,167,.08);border-color:rgba(45,212,167,.42);transform:translateX(4px)}
.dirow:hover::before{transform:scaleY(1)}
.dirow .dnum{font-family:var(--mono);font-size:13px;color:var(--accent2);min-width:24px;opacity:.85}
.dirow .dnm{flex:1;font-family:'Poppins';font-weight:600;font-size:16.5px}
.dirow .darr{color:var(--accent2);font-size:16px;opacity:.55;transition:opacity .2s,transform .2s}
.dirow:hover .darr{opacity:1;transform:translateX(3px)}
/* botón persistente del directorio (navegación scene-agnostic) */
.navhub{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:6;display:inline-flex;align-items:center;gap:9px;font-family:'Poppins';font-weight:600;font-size:13px;color:#eafff6;background:rgba(6,12,12,.42);border:1px solid rgba(45,212,167,.3);border-radius:999px;padding:11px 18px;backdrop-filter:blur(12px);cursor:pointer;box-shadow:0 8px 28px rgba(0,0,0,.4);transition:background .2s,border-color .2s,transform .2s;text-shadow:0 1px 5px #000}
.navhub:hover{background:rgba(45,212,167,.2);border-color:rgba(45,212,167,.6);transform:translateX(-50%) translateY(-2px)}
.navhub .nhic{font-family:var(--mono);color:var(--accent2);font-size:15px}

/* ====== panel de despliegue ====== */
.panel{position:fixed;top:0;right:0;height:100%;width:min(480px,93vw);z-index:8;background:linear-gradient(180deg,rgba(6,11,14,.97),rgba(4,7,10,.99));border-left:1px solid rgba(45,212,167,.22);backdrop-filter:blur(14px);transform:translateX(102%);transition:transform .55s cubic-bezier(.22,1,.36,1);padding:40px 26px 26px;display:flex;flex-direction:column;box-shadow:-30px 0 70px rgba(0,0,0,.55);overflow-y:auto}
.panel.open{transform:translateX(0)}
.panel .x{position:absolute;top:13px;right:15px;width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(6,11,14,.6);color:var(--ink);font-size:17px;cursor:pointer;line-height:1;z-index:5}
.charwrap{position:relative;height:250px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:4px}
.charwrap::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:60%;height:24px;border-radius:50%;background:radial-gradient(ellipse,rgba(45,212,167,.5),transparent 70%);filter:blur(5px)}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes sprun{from{background-position-x:0%}to{background-position-x:100%}}
@keyframes spy2{from{background-position-y:0%}to{background-position-y:100%}}
@keyframes deploy{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.charspr{display:block;height:250px;width:auto;background-repeat:no-repeat;background-position:0% 0%;filter:drop-shadow(0 0 22px rgba(25,195,125,.34)) drop-shadow(0 20px 26px rgba(0,0,0,.6));animation:breathe 6.5s ease-in-out infinite;will-change:background-position}
.charspr.reveal{animation:breathe 6.5s ease-in-out infinite, deploy .6s cubic-bezier(.22,1,.36,1) both}
.charspr.hosta{aspect-ratio:1000/877;background-size:1200% 200%}
.charspr.infraa{aspect-ratio:540/650;background-size:2500% 100%;background-position:0% 50%}
.charspr.sega{aspect-ratio:1000/1102;background-size:1200% 200%}
.charspr.pagosa{aspect-ratio:1000/1062;background-size:1000% 200%}
.charspr.susca{aspect-ratio:1000/1331;background-size:1200% 200%}
.charspr.mkta{aspect-ratio:1000/1333;background-size:1200% 200%}
.charspr.fidela{aspect-ratio:1000/1061;background-size:1200% 200%}
.charspr.dasha{aspect-ratio:1000/1338;background-size:1200% 200%}
.charspr.go.hosta{animation:breathe 6.5s ease-in-out infinite, sprun 1s steps(12,jump-none) 2 both, spy2 2s steps(2,jump-none) 1 both}
.charspr.go.sega{animation:breathe 6.5s ease-in-out infinite, sprun 1s steps(12,jump-none) 2 both, spy2 2s steps(2,jump-none) 1 both}
.charspr.go.pagosa{animation:breathe 6.5s ease-in-out infinite, sprun 1s steps(10,jump-none) 2 both, spy2 2s steps(2,jump-none) 1 both}
.charspr.go.susca{animation:breathe 6.5s ease-in-out infinite, sprun 1s steps(12,jump-none) 2 both, spy2 2s steps(2,jump-none) 1 both}
.charspr.go.mkta{animation:breathe 6.5s ease-in-out infinite, sprun 1s steps(12,jump-none) 2 both, spy2 2s steps(2,jump-none) 1 both}
.charspr.go.fidela{animation:breathe 6.5s ease-in-out infinite, sprun 1s steps(12,jump-none) 2 both, spy2 2s steps(2,jump-none) 1 both}
.charspr.go.dasha{animation:breathe 6.5s ease-in-out infinite, sprun 1s steps(12,jump-none) 2 both, spy2 2s steps(2,jump-none) 1 both}
.charspr.go.infraa{animation:breathe 6.5s ease-in-out infinite, sprun 3s steps(25,jump-none) 1 both}

.pEye{font-family:var(--mono);letter-spacing:3px;text-transform:uppercase;color:var(--accent2);font-size:11px}
.panel h2{font-family:'Poppins';font-weight:700;font-size:28px;line-height:1.03;letter-spacing:-.5px;margin-top:3px}
.pWho{font-family:var(--mono);font-size:12px;color:#9fe9cf;letter-spacing:1px;margin-top:5px}
.pTxt{font-size:14.5px;line-height:1.5;color:#cfe0dc;margin-top:11px}
.clubpill{position:fixed;top:44px;right:22px;z-index:6;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;background:rgba(6,12,12,.62);border:1px solid rgba(255,214,140,.45);backdrop-filter:blur(8px);cursor:pointer;font:600 12.5px Poppins,system-ui,sans-serif;color:#effff9;transition:transform .2s}
.clubpill .cs{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,214,140,.18);color:#ffd27a;font-size:12px}
.clubpill i{font-style:normal;font-size:11.5px;letter-spacing:.5px}
.clubpill.bump{animation:cbump .6s ease}
@keyframes cbump{30%{transform:scale(1.12)}100%{transform:none}}
.clubtoast{position:fixed;left:50%;top:92px;z-index:8;transform:translate(-50%,-10px);opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 18px;border-radius:14px;background:rgba(7,14,14,.86);border:1px solid rgba(255,214,140,.5);box-shadow:0 14px 40px rgba(0,0,0,.4);transition:opacity .3s,transform .3s;text-align:center;max-width:86vw}
.clubtoast.on{opacity:1;transform:translate(-50%,0)}
.clubtoast b{font:700 16px Poppins,system-ui,sans-serif;color:#ffd27a}
.clubtoast span{font-size:12.5px;color:#d6e6e2}
.clubcard{position:fixed;right:22px;bottom:90px;z-index:7;width:min(360px,88vw);padding:18px;border-radius:18px;background:linear-gradient(180deg,rgba(14,20,18,.95),rgba(7,11,12,.97));border:1px solid rgba(255,214,140,.45);box-shadow:0 24px 60px rgba(0,0,0,.5);color:#e8f4f1;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .35s,transform .35s}
.clubcard.on{opacity:1;pointer-events:auto;transform:none}
.clubcard .cx{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:transparent;color:#e8f4f1;cursor:pointer}
.clubcard .ce{font:11px 'Share Tech Mono',monospace;letter-spacing:2.5px;text-transform:uppercase;color:#ffd99a}
.clubcard .ch{display:flex;align-items:baseline;gap:12px;margin:6px 0 10px}
.clubcard .ct{font:700 22px Poppins,system-ui,sans-serif}
.clubcard .ch b{font:600 15px Poppins,system-ui,sans-serif;color:#cfe5df}
.clubcard .cr{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:12px;background:rgba(255,214,140,.08);border:1px solid rgba(255,214,140,.35)}
.clubcard .cr span{font:11px 'Share Tech Mono',monospace;letter-spacing:1.5px;text-transform:uppercase;color:#ffd99a}
.clubcard .cr b{font:600 15px Poppins,system-ui,sans-serif}
.clubcard .cbtn{align-self:flex-start;margin-top:6px;padding:8px 14px;border-radius:10px;background:#19C37D;color:#03110b;font:700 13px Poppins,system-ui,sans-serif;text-decoration:none}
.clubcard .cp{font-size:13.5px;margin:10px 0 0;color:#d6e6e2}
.clubcard .cm{margin-top:10px}
.clubcard .cm span{font-size:12px;color:#9fb3ae}
.clubcard .cm div{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.clubcard .cm button{font:600 12px Poppins,system-ui,sans-serif;color:#bff3e1;background:rgba(45,212,167,.07);border:1px solid rgba(45,212,167,.35);border-radius:9px;padding:6px 9px;cursor:pointer}
.clubcard .cn{font-size:12px;line-height:1.45;color:#8fa29d;margin:12px 0 0}
.hs.act .mk{border-color:rgba(255,214,140,.95);box-shadow:0 0 14px rgba(255,200,110,.35)}
.hs.act .mk .ic{font:700 13px Poppins,system-ui,sans-serif;color:#ffe2a8}
@media (max-width:820px){.clubpill{top:40px;right:12px}.clubcard{right:12px;left:12px;width:auto;bottom:84px}}
.holo-n{position:fixed;left:0;top:0;z-index:4;pointer-events:none;display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:999px;background:linear-gradient(180deg,rgba(12,38,34,.72),rgba(6,20,18,.66));border:1px solid rgba(45,212,167,.6);box-shadow:0 0 26px rgba(45,212,167,.22),inset 0 0 14px rgba(45,212,167,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;white-space:nowrap;will-change:transform,opacity}
.holo-n .hic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(45,212,167,.2);color:#bdfbe6;font:700 15px Poppins,system-ui,sans-serif}
.holo-n .htx{display:flex;flex-direction:column;line-height:1.2}
.holo-n b{font:600 13.5px Poppins,system-ui,sans-serif;color:#effff9}
.holo-n i{font:normal 11.5px 'Share Tech Mono',monospace;color:#9fe9cf;letter-spacing:.3px}
@media (max-width:820px){.holo-n{padding:6px 12px 6px 6px;gap:8px}.holo-n .hic{width:24px;height:24px;font-size:12px}.holo-n b{font-size:11.5px}.holo-n i{font-size:10px}}
/* ===== panel del especialista (contenido ampliado) ===== */
.pLead{font-size:15px;line-height:1.55;color:#dbe9e5;margin-top:12px}
.pSec{font-family:var(--mono);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent2);margin-top:20px}
.pList{list-style:none;margin:9px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.pList li{position:relative;padding-left:20px;font-size:14px;line-height:1.45;color:#cfe0dc}
.pList li::before{content:"";position:absolute;left:2px;top:.55em;width:8px;height:8px;border-radius:2px;background:var(--accent2);box-shadow:0 0 10px rgba(45,212,167,.55)}
.pList li b{color:#eafff6;font-weight:600}
.pLibs{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.pLibs span{font-family:var(--mono);font-size:12px;color:#bff3e1;background:rgba(45,212,167,.07);border:1px solid rgba(45,212,167,.28);border-radius:7px;padding:5px 9px}
.pCta{display:flex;flex-direction:column;gap:9px;margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)}
.pBtn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;font-family:'Poppins';font-weight:600;font-size:14.5px;border-radius:12px;padding:13px 16px;transition:transform .18s,background .2s,border-color .2s}
.pBtn.pri{background:var(--accent);color:#03110b}
.pBtn.pri:hover{transform:translateY(-1px);background:#22d58a}
.pBtn.sec{background:rgba(255,255,255,.03);color:var(--ink);border:1px solid rgba(45,212,167,.4)}
.pBtn.sec:hover{transform:translateY(-1px);background:rgba(45,212,167,.08)}
.pBtn.soon{background:rgba(255,255,255,.03);color:#9fb3ae;border:1px dashed rgba(45,212,167,.35);cursor:default;pointer-events:none}
.pBtn .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:rgba(45,212,167,.14);color:var(--accent2)}
.pNote{font-size:12.5px;line-height:1.45;color:#8fa29d}
.hs.act.mag .mk{width:40px;height:40px;border-color:rgba(255,236,200,.95);background:rgba(20,16,10,.45);box-shadow:0 0 18px rgba(255,220,160,.35)}
.hs.act.mag .mk .ic{color:#fff3dc;display:flex}
.hs.act.mag .lbl{opacity:1;transform:translateX(-50%);top:50px;background:rgba(18,14,8,.62);border-color:rgba(255,220,160,.4)}
.krow{margin-top:34px}.krow:first-of-type{margin-top:0}
.krt{font:600 13px 'Poppins',sans-serif;letter-spacing:.3px;color:#e9f1ee;margin:0 0 12px;display:flex;align-items:center;gap:10px}.krt::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.14)}
.klang{position:absolute;top:8px;right:8px;z-index:2;font:700 9px 'Share Tech Mono',monospace;letter-spacing:1px;padding:2px 5px;border-radius:3px;background:#17150f;color:#f1ece0;font-style:normal}
.kmz{aspect-ratio:3/4;border-radius:3px;padding:0;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:inset 6px 0 10px -6px rgba(0,0,0,.6);color:#fff}
.kmz.m1{background:linear-gradient(170deg,#14324a,#0b1a28)}.kmz.m2{background:linear-gradient(170deg,#2b1c43,#150d23)}.kmz.m3{background:linear-gradient(170deg,#f2efe8,#e6e0d4);color:#14171c}
.kmz.m4{background:radial-gradient(120% 70% at 70% 20%,#1d2a4a,#05070d 70%)}.kmz.m5{background:linear-gradient(170deg,#1f3a2b,#0f1f16)}
.kzt{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;padding:12px 12px 0}.kzt span{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:22px;line-height:.95;letter-spacing:-.5px}
.kzt i{font-style:normal;font:700 9px 'Share Tech Mono',monospace;letter-spacing:1px;padding:2px 5px;border-radius:3px;background:rgba(255,255,255,.18)}.kmz.m3 .kzt i{background:rgba(0,0,0,.1)}
.kzs{margin:6px 12px 0;padding:4px 0;border-top:1px solid currentColor;border-bottom:1px solid currentColor;opacity:.75;font:8.5px 'Share Tech Mono',monospace;letter-spacing:1.3px;text-transform:uppercase}
.kzh{margin:auto 12px 0;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:16px;line-height:1.12;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.kzh.sk{height:60px}
.kzl{margin:8px 12px 0;font-size:9.5px;line-height:1.35;opacity:.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kzf{margin:10px 12px 12px;font:7.5px 'Share Tech Mono',monospace;letter-spacing:1px;text-transform:uppercase;opacity:.6}
.kloc{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.klm{display:flex;flex-direction:column;gap:3px;padding:14px 14px 12px;border-radius:4px;text-decoration:none;color:#17150f;background:#efe9dc;box-shadow:2px 2px 0 #d9d0bf;transition:transform .25s,box-shadow .25s}
.klm:hover{transform:translateY(-4px);box-shadow:4px 8px 18px rgba(0,0,0,.35)}

var MAG=[{"id": "d2c", "kick": "Editorial", "room": 0, "min": 3, "title": "Vender directo ya no es opcional", "deck": "Las marcas que controlan su propio canal conocen a su cliente, cuidan su margen y deciden a qué ritmo crecer.", "quote": "Cuando vendes directo, el cliente es tuyo.", "body": ["Vender directo, o D2C (direct-to-consumer), significa llegar a tu cliente sin intermediarios. Tu app o tu web son, al mismo tiempo, la tienda, la caja y el mostrador.", "Cuando vendes a través de un marketplace o de un distribuidor, ellos se quedan con una parte de cada venta y, sobre todo, con la relación: saben quién compra, cuándo y por qué. Tú solo ves un pedido.", "Vender directo cambia eso. Sabes qué compra cada persona, cada cuánto vuelve y qué le falta. Con esa información decides precios, lanzamientos y promociones con datos propios, no prestados.", "El costo es que tienes que construir lo que el intermediario te daba hecho: servidores que no se caigan, cobros seguros, protección de datos, marketing que traiga gente y razones para que vuelva. Por eso muchas marcas se quedan a medio camino.", "Este estudio existe para resolver ese tramo. Cada piso es una capa de tu producto y en cada uno está la persona que la construye. Recorrerlo es ver tu app armada, pieza por pieza."]}, {"id": "capas", "kick": "Guía", "room": 1, "min": 4, "title": "Las 7 capas de una app D2C", "deck": "Un mapa rápido para saber qué necesitas, en qué orden y por qué.", "quote": "No necesitas las siete el primer día, pero sí saber cuándo llega cada una.", "body": ["<b>01 · Infraestructura.</b> Servidores, base de datos y despliegues. Es lo que hace que tu app responda igual con diez usuarios que con diez mil.", "<b>02 · Seguridad.</b> Quién entra, qué puede ver y cómo viajan los datos. Se define desde el diseño, no como parche al final.", "<b>03 · Pagos.</b> El checkout, las pasarelas y la facturación. Cada paso de más es una venta que se pierde.", "<b>04 · Suscripciones.</b> Planes, renovaciones y cobros recurrentes. Convierten una venta en un ingreso que se repite.", "<b>05 · Marketing.</b> Analítica, SEO, campañas y automatizaciones. Traen a las personas correctas y te dicen qué canal vende de verdad.", "<b>06 · Fidelización.</b> Recompensas, referidos y escucha activa. Hacen que el cliente vuelva y que recomiende.", "<b>07 · Dashboards.</b> Todo lo anterior en una pantalla, para decidir con datos y actuar a tiempo.", "El orden importa. Sin infraestructura y seguridad no hay dónde vender; sin pagos no hay negocio; sin marketing nadie llega; sin fidelización cada cliente se va después de la primera compra."]}, {"id": "cobros", "kick": "Capa 03 · Pagos", "room": 3, "min": 3, "title": "Cobrar en Ecuador sin fricción", "deck": "Cuatro decisiones que separan un checkout que vende de uno que espanta.", "quote": "El mejor checkout es el que el cliente casi no nota.", "body": ["<b>1. Pocos pasos.</b> Pide solo lo necesario para cobrar y entregar. Cada campo extra es una oportunidad para abandonar la compra.", "<b>2. Los medios de pago que tu cliente ya usa.</b> En Ecuador eso significa pasarelas locales como Payphone, Kushki o Datafast para tarjetas y otros medios. Si vendes fuera del país, se suma una pasarela internacional.", "<b>3. Nunca guardes una tarjeta.</b> La pasarela la convierte en un token y tú solo guardas ese token. Así tus clientes pueden recomprar con un toque y tú no cargas con el riesgo de custodiar números de tarjeta.", "<b>4. Que el pago dispare todo lo demás.</b> Un pago confirmado debe activar al instante el acceso, el envío, el aviso al cliente y la factura electrónica del SRI, sin que nadie de tu equipo tenga que hacerlo a mano.", "Con eso resuelto, cobrar deja de ser un trámite y se vuelve una ventaja: el cliente paga rápido, tú recibes directo y la contabilidad se ordena sola."]}, {"id": "volver", "kick": "Capa 06 · Fidelización", "room": 6, "min": 3, "title": "El cliente que vuelve", "deck": "Conseguir un cliente cuesta; que regrese por gusto vale mucho más.", "quote": "Un buen programa de lealtad no se explica: se siente.", "body": ["La primera compra suele ser la más cara: anuncios, descuentos y tiempo para convencer. La segunda, si el cliente quedó contento, cuesta mucho menos. Ahí está el margen de una marca D2C.", "<b>Reconocer.</b> Saludar por su nombre, recordar lo que compró y mostrarle su progreso. La gente vuelve a donde la reconocen.", "<b>Premiar lo que importa.</b> Puntos y niveles funcionan cuando la recompensa se puede ver y alcanzar, no cuando queda en la letra pequeña.", "<b>Convertir clientes en canal.</b> Un programa de referidos con premio para ambos lados hace que tus mejores clientes te traigan a los siguientes.", "<b>Escuchar antes de perder.</b> Una encuesta corta en el momento justo te avisa quién está por irse mientras todavía puedes hacer algo.", "Si ya pasaste por la capa 06, lo viviste: el Club CruzTRD de este recorrido funciona exactamente así."]}, {"id": "datos", "kick": "Capa 07 · Dashboards", "room": 7, "min": 3, "title": "Cinco números para decidir sin adivinar", "deck": "Los indicadores que toda app D2C debería mirar cada semana.", "quote": "Si lo que te cuesta conseguir un cliente supera lo que te deja, crecer solo acelera la pérdida.", "body": ["<b>Costo de adquisición (CAC).</b> Lo que inviertes en marketing y ventas dividido para los clientes nuevos que llegaron. Te dice cuánto te cuesta cada cliente.", "<b>Conversión.</b> De cada cien personas que visitan tu app, cuántas compran. Es el primer lugar donde mirar cuando las ventas no despegan.", "<b>Retención.</b> Qué porcentaje de tus clientes sigue comprando o usando tu app después de uno, tres y seis meses. Mide si tu producto de verdad sirve.", "<b>Valor de vida del cliente (LTV).</b> Lo que deja un cliente promedio durante toda su relación contigo. Es el techo de lo que puedes invertir para conseguirlo.", "<b>Ingresos recurrentes (MRR).</b> Si cobras por suscripción, lo que entra cada mes de forma predecible. Es la base para planificar contrataciones y gastos.", "La regla de oro: el LTV tiene que ser bastante mayor que el CAC. Un buen dashboard te lo muestra en segundos, sin esperar al cierre de mes."]}];
